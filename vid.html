<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLAYER</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #000;
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        #buy-button {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 50px;
            background: linear-gradient(to right, #ff69b4, #ffe9cc, #b3fffc, #c6f4d6, #c9e4ca);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="player" class="video-js" controls></video>
    </div>
    <div id="message">يجب شراء 5 ريال لاستكمال الفيديو</div>
    <button id="buy-button" onclick="goToPayment()">شراء الفديو</button>
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player;
        var timedOut = false;
        var playCount = localStorage.getItem("playCount");
        if (playCount === null) {
            playCount = 0;
        }

        if (playCount < 2) {
            if (navigator.userAgent.indexOf('Safari') === -1 && navigator.userAgent.indexOf('Firefox') === -1 && navigator.userAgent.indexOf('Chrome') === -1) {
                document.getElementById("message").style.display = "flex";
                document.getElementById("message").innerHTML = "يجب استخدام متصفح داعم";
            } else {
                player = videojs('player', {
                    techOrder: ['html5'],
                    sources: [{
                        type: 'video/mp4',
                        src: 'https://q5.qa/C++%20vs%20JAVA%20vs%20PYTHON_%20Which%20Coding%20Language%20Will%20You%20Choose_%20_%20Coding%20Ninjas%20_shorts.mp4'
                    }],
                    controls: true,
                    autoplay: true,
                    loop: false,
                    muted: false,
                    playsinline: true
                });

                setTimeout(stopVideo, 20000);
                playCount++;
                localStorage.setItem("playCount", playCount);

                player.on('play', function() {
                    console.log('Video is playing');
                });

                player.on('pause', function() {
                    player.pause();
                });
            }
        } else {
            document.getElementById("message").style.display = "flex";
            document.getElementById("message").innerHTML = "لقد استخدمت جميع مقاطع الفيديو المتاحة";
            document.getElementById("buy-button").style.display = "block";
        }

        function stopVideo() {
            if (!timedOut) {
                player.pause();
                document.getElementById("message").style.display = "flex";
                document.getElementById("buy-button").style.display = "block";
                timedOut = true;
            }
        }

        function goToPayment() {
            window.location.href = "payment.html";
        }
    </script>
</body>
</html>
