<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PLAYER</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @media (max-width: 768px) {
            .video-container {
                width: 95%;
                height: 80%;
            }
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #000;
            color: #fff;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        #buy-button {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 50px;
            background: linear-gradient(to right, #ff69b4, #ffe9cc, #b3fffc, #c6f4d6, #c9e4ca);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div id="player" style="width: 100%; height: 100%;"></div>
    </div>
    <div id="message">يجب شراء 5 ريال لاستكمال الفيديو</div>
    <button id="buy-button" onclick="goToPayment()">شراء الفديو</button>
    <script>
        var player;
        var timedOut = false;
        var playCount = localStorage.getItem("playCount");
        if (playCount === null) {
            playCount = 0;
        }
        
        // Load YouTube Iframe API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        
        window.onYouTubeIframeAPIReady = function() {
            if (playCount < 2) {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: 'dETJKHWiYk8',
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    },
                    playerVars: {
                        'controls': 0,
                        'autoplay': 1,
                        'loop': 0,
                        'showinfo': 0,
                        'modestbranding': 1,
                        'mute': 0,
                        'playsinline': 1
                    }
                });
                setTimeout(stopVideo, 20000);
                playCount++;
                localStorage.setItem("playCount", playCount);
            } else {
                document.getElementById("message").style.display = "flex";
                document.getElementById("message").innerHTML = "لقد استخدمت جميع مقاطع الفيديو المتاحة";
                document.getElementById("buy-button").style.display = "block";
            }
        };

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                // Video is playing
            }
            if (event.data == YT.PlayerState.PAUSED) {
                player.stopVideo();
            }
        }

        function stopVideo() {
            if (!timedOut) {
                player.stopVideo();
                document.getElementById("message").style.display = "flex";
                document.getElementById("buy-button").style.display = "block";
                timedOut = true;
            }
        }

        function goToPayment() {
            window.location.href = "payment.html";
        }
    </script>
</body>
</html>
