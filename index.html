<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f9;
            overflow: hidden;
            text-align: center;
        }

        .title {
            font-size: 2.5rem; /* Adjusted size for better mobile viewing */
            font-weight: bold;
            background: linear-gradient(90deg, red, orange, yellow, green, blue, purple);
            background-size: 300%;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradient-animation 5s ease infinite;
            text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.4);
            margin: 0;
            z-index: 1;
        }

        .subtitle {
            font-size: 1.2rem; /* Adjusted size for better mobile viewing */
            font-weight: normal;
            color: transparent;
            background: linear-gradient(90deg, #ff0080, #ff8c00, #ffe000, #8eff00, #00ffe0, #0080ff);
            background-size: 300%;
            -webkit-background-clip: text;
            animation: gradient-animation 5s ease infinite;
            text-shadow: 0px 0px 20px rgba(0, 0, 0, 0.8);
            margin-top: 10px;
            z-index: 1;
        }

        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .social-links {
            margin-top: 15px; /* Reduced margin for mobile */
            display: flex;
            flex-direction: column; /* Stack links vertically on small screens */
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .social-link {
            text-decoration: none;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            color: white;
            width: 100%; /* Set width to 100% for better touch targets */
            text-align: center; /* Center text in buttons */
        }

        .gameguardian {
            background-color: #800080;
        }

        .iosgods {
            background-color: #007aff;
        }

        .github {
            background-color: #333;
        }

        .cv {
            background-color: #4caf50;
        }

        .instagram {
            background-color: #8a3ab9;
        }

        .x {
            background-color: #000000;
        }

        .tiktok {
            background-color: #000000;
        }

        .telegram {
            background-color: #0088cc;
        }

        .snapchat {
            background-color: #ffff00;
        }

        .linkedin {
            background-color: #0077b5;
        }

        .discord {
            background-color: #5865f2;
        }

        .youtube {
            background-color: #ff0000;
        }

        .facebook {
            background-color: #1877f2;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); /* Adjusted to be more mobile-friendly */
            gap: 15px;
            max-width: 1000px;
            width: 90%;
            margin-top: 20px; /* Adjusted margin for mobile */
        }

        .logo-card {
            background-color: white;
            padding: 20px; /* Reduced padding for mobile */
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .logo-card:hover {
            transform: translateY(-5px);
        }

        .logo-wrapper img {
            width: 60px; /* Adjusted size for images */
            height: 60px; /* Adjusted size for images */
        }

        .snapchat-logo {
            width: 100px; /* Adjusted width for Snapchat logo */
            height: 100px; /* Adjusted height for Snapchat logo */
        }

        .platform-name {
            margin-top: 10px; /* Adjusted margin for mobile */
            font-size: 14px; /* Smaller font size for mobile */
            font-weight: 600;
            color: white;
        }

        .instagram-card {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .x-card {
            background-color: #000000;
        }

        .tiktok-card {
            background: linear-gradient(45deg, #00f2ea, #ff0050);
        }

        .telegram-card {
            background-color: #0088cc;
        }

        .snapchat-card {
            background-color: #ffff00;
        }

        .linkedin-card {
            background-color: #0077b5;
        }

        .discord-card {
            background-color: #5865f2;
        }

        .youtube-card {
            background-color: #ff0000;
        }

        .facebook-card {
            background-color: #1877f2;
        }
    </style>
</head>

<body>
    <div>
        <h1 class="title"></h1>
        <h2 class="subtitle">Mohmmad Hissyn Aon (Endup)</h2>
        <div class="social-links">
            <a href="https://gameguardian.net" target="_blank" class="social-link gameguardian">Game Guardian</a>
            <a href="https://iosgods.com" target="_blank" class="social-link iosgods">iOSGods</a>
            <a href="https://github.com" target="_blank" class="social-link github">GitHub</a>
            <a href="cv.pdf" target="_blank" class="social-link cv">CV</a>
        </div>
    </div>

    <div class="container">
        <div class="logo-card instagram-card">
            <div class="logo-wrapper">
                <img src="https://img.icons8.com/m_outlined/512/FFFFFF/instagram-new.png" alt="Instagram Logo">
            </div>
            <div class="platform-name">Instagram</div>
        </div>
        <div class="logo-card x-card">
            <div class="logo-wrapper">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/X_logo_2023_%28white%29.png/800px-X_logo_2023_%28white%29.png"
                    alt="X Logo">
            </div>
            <div class="platform-name">X (Twitter)</div>
        </div>
        <div class="logo-card tiktok-card">
            <div class="logo-wrapper">
                <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/tiktok-white-icon.png"
                    alt="TikTok Logo">
            </div>
            <div class="platform-name">TikTok</div>
        </div>
        <div class="logo-card telegram-card">
            <div class="logo-wrapper">
                <img src="https://img.icons8.com/m_outlined/512/FFFFFF/telegram-app.png" alt="Telegram Logo">
            </div>
            <div class="platform-name">Telegram</div>
        </div>
        <div class="logo-card snapchat-card">
            <div class="logo-wrapper">
                <img class="snapchat-logo" src="https://i.ibb.co/gv5zVKh/sm-5af2d4ca1b4fa-removebg-preview.png" alt="Snapchat Logo">
            </div>
            <div class="platform-name">Snapchat</div>
        </div>
        <div class="logo-card linkedin-card">
            <div class="logo-wrapper">
                <img src="https://i.ibb.co/KhQfG02/images-removebg-preview.png" alt="LinkedIn Logo">
            </div>
            <div class="platform-name">LinkedIn</div>
        </div>
        <div class="logo-card discord-card">
            <div class="logo-wrapper">
                <img src="https://img.icons8.com/ios11/512/FFFFFF/discord-logo.png" alt="Discord Logo">
            </div>
            <div class="platform-name">Discord</div>
        </div>
        <div class="logo-card youtube-card">
            <div class="logo-wrapper">
                <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/youtube-app-white-icon.png"
                    alt="YouTube Logo">
            </div>
            <div class="platform-name">YouTube</div>
        </div>
    </div>
</body>

</html>
