<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Jotter</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f4f9;
            overflow: hidden;
            text-align: center; /* يعيد محاذاة النص إلى المنتصف */
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(90deg, red, orange, yellow, green, blue, purple);
            background-size: 300%;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradient-animation 5s ease infinite;
            text-shadow: 3px 3px 0 rgba(255, 255, 255, 0.4);
            margin: 0;
            z-index: 1;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: normal;
            color: transparent;
            background: linear-gradient(90deg, #ff0080, #ff8c00, #ffe000, #8eff00, #00ffe0, #0080ff);
            background-size: 300%;
            -webkit-background-clip: text;
            animation: gradient-animation 5s ease infinite;
            text-shadow: 0px 0px 20px rgba(0, 0, 0, 0.8);
            margin-top: 10px;
            z-index: 1;
        }

        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .social-links {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center; /* لضمان محاذاة الروابط في المنتصف */
        }

        .social-link {
            text-decoration: none;
            font-weight: 500;
            padding: 10px 28px;
            border-radius: 25px;
            transition: all 0.3s ease;
            color: white;
        }

        .gameguardian { background-color: #800080; }
        .iosgods { background-color: #007aff; }
        .github { background-color: #333; }
        .cv { background-color: #4caf50; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 90%;
            margin-top: 40px;
        }

        .logo-card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .logo-card:hover {
            transform: translateY(-5px);
        }

        .logo-wrapper svg {
            width: 80px;
            height: 80px;
        }

        .platform-name {
            margin-top: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white; /* تغيير لون اسم المنصة إلى الأبيض */
        }

        .instagram-card { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .twitter-card { background-color: #000000; }
        .tiktok-card { background: linear-gradient(45deg, #00f2ea, #ff0050); }
        .telegram-card { background-color: #0088cc; }
        .snapchat-card { background-color: #000000; }
        .linkedin-card { background-color: #0077b5; }
        .discord-card { background-color: #5865f2; }
        .youtube-card { background-color: #ff0000; }
    </style>
</head>
<body>
    <div>
        <h1 class="title">Job Jotter</h1>
        <h2 class="subtitle">Mohmmad Hissyn Aon (Endup)</h2>
        <div class="social-links">
            <a href="https://gameguardian.net" target="_blank" class="social-link gameguardian">Game Guardian</a>
            <a href="https://iosgods.com" target="_blank" class="social-link iosgods">iOSGods</a>
            <a href="https://github.com" target="_blank" class="social-link github">GitHub</a>
            <a href="cv.pdf" target="_blank" class="social-link cv">CV</a>
