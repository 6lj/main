<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5">
    <title>Welcome</title>
    <link rel="stylesheet" href="styles4.css">
    <style>
        .lang-toggle {
            margin-top: 10px; 
        }
        body {
            width: 100%;
            margin: 0;
            overflow-x: auto;
            -webkit-text-size-adjust: none;
            touch-action: pan-x pan-y;
            min-height: 100vh;
            font-size: 16px; 
        }
        .container {
            width: 100%;
            max-width: 1024px; 
            margin: 0 auto;
        }
        @media only screen and (max-width: 1024px) {
            body {
                transform: scale(0.8); 
                transform-origin: top left;
            }
            .container {
                width: 100%;
                padding: 0 10px; 
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="scroll-indicator"></div>
    <div class="container">
        <div class="header">
            <h1 class="main-title">Welcome!</h1>
            <h2 class="subtitle">Mohmmad Hissyn Aon (Endup)</h2>
        </div>
        <div class="main-grid">
            <div class="glass-card social-links">
                <a href="https://gameguardian.net/forum/profile/1301541-endup/" target="_blank" class="social-link gameguardian">Game Guardian (LUA) </a>
                <a href="https://iosgods.com/profile/3009815-endup/" target="_blank" class="social-link iosgods">iOSGods(Obj-C) </a>
                <a href="https://github.com/6lj" target="_blank" class="social-link github">GitHub</a>
                <a href="https://cv.q5.qa/" class="social-link cv" class="social-link cv">CV</a>
            </div>
            <div class="glass-card">
                <a href="https://discord.gg/UGSFeT3h5f" target="_blank" class="logo-card discord-card">
                    <div class="logo-wrapper">
                        <img src="https://img.icons8.com/ios11/512/FFFFFF/discord-logo.png" alt="Discord Logo">
                    </div>
                    <div class="platform-name">Discord</div>
                </a>
                <a href="https://www.linkedin.com/in/mohammad-al-abyah-a02220371/" target="_blank" class="logo-card linkedin-card">
                    <div class="logo-wrapper">
                        <img src="https://i.ibb.co/KhQfG02/images-removebg-preview.png" alt="LinkedIn Logo">
                    </div>
                    <div class="platform-name">LinkedIn</div>
                </a>
                <a href="https://x.com/m4ua" target="_blank" class="logo-card x-card">
                    <div class="logo-wrapper">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/X_logo_2023_%28white%29.png/800px-X_logo_2023_%28white%29.png" alt="X Logo">
                    </div>
                    <div class="platform-name">X (Twitter)</div>
                </a>
                <a href="https://t.me/ENDUP1" target="_blank" class="logo-card telegram-card">
                    <div class="logo-wrapper">
                        <img src="https://img.icons8.com/m_outlined/512/FFFFFF/telegram-app.png" alt="Telegram Logo">
                    </div>
                    <div class="platform-name">Telegram</div>
                </a>
            </div>
            <div class="glass-card">
                <a href="https://snapchat.com/t/9LnEKbiO" target="_blank" class="logo-card snapchat-card">
                    <div class="logo-wrapper">
                        <img src="https://i.ibb.co/gv5zVKh/sm-5af2d4ca1b4fa-removebg-preview.png" alt="Snapchat Logo">
                    </div>
                    <div class="platform-name">Snapchat</div>
                </a>
                <a href="https://youtube.com/@endup_?si=J2lbZHqQehM_JQZC" target="_blank" class="logo-card youtube-card">
                    <div class="logo-wrapper">
                        <img src="youtube.png" alt="YouTube Logo">
                    </div>
                    <div class="platform-name">YouTube</div>
                </a>
                <a href="https://www.instagram.com/ry3c?igsh=ZjZybjg3bWt3dWw3&utm_source=qr" target="_blank" class="logo-card instagram-card">
                    <div class="logo-wrapper">
                        <img src="https://img.icons8.com/m_outlined/512/FFFFFF/instagram-new.png" alt="Instagram Logo">
                    </div>
                    <div class="platform-name">Instagram</div>
                </a>
                <a href="https://www.tiktok.com/@7s4?_t=ZS-8xMCTKjZGxE&_r=1" target="_blank" class="logo-card tiktok-card">
                    <div class="logo-wrapper">
                        <img src="tiktok.png" alt="TikTok Logo">
                    </div>
                    <div class="platform-name">TikTok</div>
                </a>
            </div>
        </div>
    </div>
    <div class="modal" id="cvModal">
        <div class="modal-content glass-card">
            <p>We are working on it.</p>
            <div class="modal-buttons">
                <button class="submit-btn" onclick="closeCVMessage()">Close</button>
            </div>
        </div>
    </div>
    <script>

        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.width = `${Math.random() * 4 + 2}px`;
            particle.style.height = particle.style.width;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(particle);
        }

        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.querySelector('.scroll-indicator').style.transform = `scaleX(${scrolled / 100})`;
        });

        function showCVMessage() {
            document.getElementById('cvModal').style.display = 'flex';
        }
        function closeCVMessage() {
            document.getElementById('cvModal').style.display = 'none';
        }

        document.addEventListener('touchstart', function(event) {
            if (event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
