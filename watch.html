<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="format-detection" content="telephone=no">
    <title>Mohammed Al-Abyah</title>
    <meta name="description" content="Introduction video by Mohammed Al-Abyah.">

    <link rel="canonical" href="https://q5.qa/watch">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="q5.qa">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://q5.qa/watch">
    <meta property="og:title" content="Mohammed Al-Abyah">
    <meta property="og:description" content="Watch the full introduction video.">
    <meta property="og:image" content="https://q5.qa/linkedin-cover.jpg">
    <meta property="og:image:secure_url" content="https://q5.qa/linkedin-cover.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="627">
    <meta property="og:image:alt" content="Mohammed Al-Abyah">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mohammed Al-Abyah">
    <meta name="twitter:description" content="Watch the full introduction video.">
    <meta name="twitter:image" content="https://q5.qa/linkedin-cover.jpg">

    <style>
        :root {
            --bg: #070b14;
            --card: rgba(255, 255, 255, 0.06);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f4f7fb;
            --muted: #a8b3c7;
            --accent: #2f80ed;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(circle at 80% 0%, rgba(47, 128, 237, 0.22), transparent 40%),
                var(--bg);
            color: var(--text);
            -webkit-text-size-adjust: 100%;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .wrap {
            width: min(920px, calc(100% - 24px));
            margin: 0 auto;
            padding: 24px 0 48px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }
        .player {
            background: #000;
            border-radius: 24px 24px 0 0;
            line-height: 0;
        }
        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 70dvh;
            background: #000;
        }
        .info {
            padding: 20px 20px 24px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: clamp(22px, 5vw, 28px);
            line-height: 1.3;
        }
        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .primary {
            background: var(--accent);
            color: #fff;
        }
        .ghost {
            border: 1px solid var(--line);
            color: var(--text);
        }
        .error {
            display: none;
            margin-top: 12px;
        }
        .error a { color: var(--accent); }
        @media (max-width: 640px) {
            .actions { flex-direction: column; }
            a.btn { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <article class="card">
            <div class="player">
                <video
                    id="intro-video"
                    controls
                    playsinline
                    preload="metadata"
                    poster="https://q5.qa/linkedin-cover.jpg"
                >
                    <source src="/media/video.mp4" type="video/mp4">
                    This browser cannot play the video.
                    <a href="/media/video.mp4">Open or download it here</a>.
                </video>
            </div>
            <div class="info">
                <h1>Mohammed Al-Abyah</h1>
                <p>Introduction video. Press play to watch.</p>
                <p class="error" id="play-error">Video could not start. <a href="/media/video.mp4">Tap here to open it</a>.</p>
                <div class="actions">
                    <a class="btn primary" id="download-video" href="/media/video.mp4" download="video.mp4">Download video</a>
                    <a class="btn ghost" href="/">Back to website</a>
                </div>
            </div>
        </article>
    </main>
    <script>
        (function () {
            var videoUrl = "/media/video.mp4";
            var video = document.getElementById("intro-video");
            var downloadBtn = document.getElementById("download-video");
            var playError = document.getElementById("play-error");

            video.setAttribute("webkit-playsinline", "true");
            video.setAttribute("playsinline", "true");

            function isAppleMobile() {
                return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            }

            function showPlayError() {
                playError.style.display = "block";
            }

            video.addEventListener("error", showPlayError);
            var source = video.querySelector("source");
            if (source) {
                source.addEventListener("error", showPlayError);
            }

            downloadBtn.addEventListener("click", function (event) {
                event.preventDefault();
                if (downloadBtn.getAttribute("data-busy") === "1") return;

                if (isAppleMobile()) {
                    window.open(videoUrl, "_blank", "noopener");
                    return;
                }

                var originalText = downloadBtn.textContent;
                downloadBtn.setAttribute("data-busy", "1");
                downloadBtn.textContent = "Downloading...";

                fetch(videoUrl)
                    .then(function (response) {
                        if (!response.ok) throw new Error("Download failed");
                        return response.blob();
                    })
                    .then(function (blob) {
                        var objectUrl = URL.createObjectURL(blob);
                        var link = document.createElement("a");
                        link.href = objectUrl;
                        link.download = "video.mp4";
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                        URL.revokeObjectURL(objectUrl);
                    })
                    .catch(function () {
                        window.open(videoUrl, "_blank", "noopener");
                    })
                    .then(function () {
                        downloadBtn.setAttribute("data-busy", "0");
                        downloadBtn.textContent = originalText;
                    });
            });
        })();
    </script>
</body>
</html>
