<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mohammed Al-Abyah</title>
    <meta name="description" content="Introduction video by Mohammed Al-Abyah.">

    <link rel="canonical" href="https://q5.qa/watch.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="q5.qa">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://q5.qa/watch.html">
    <meta property="og:title" content="Mohammed Al-Abyah">
    <meta property="og:description" content="Watch the full introduction video.">
    <meta property="og:image" content="https://q5.qa/linkedin-cover.jpg">
    <meta property="og:image:secure_url" content="https://q5.qa/linkedin-cover.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="627">
    <meta property="og:image:alt" content="Mohammed Al-Abyah">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Mohammed Al-Abyah">
    <meta name="twitter:description" content="Watch the full introduction video.">
    <meta name="twitter:image" content="https://q5.qa/linkedin-cover.jpg">

    <style>
        :root {
            --bg: #070b14;
            --card: rgba(255, 255, 255, 0.06);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f4f7fb;
            --muted: #a8b3c7;
            --accent: #2f80ed;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "SF Pro Text", "Segoe UI", Tahoma, sans-serif;
            background:
                radial-gradient(circle at 80% 0%, rgba(47, 128, 237, 0.22), transparent 40%),
                var(--bg);
            color: var(--text);
        }
        .wrap {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 64px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(16px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }
        video {
            display: block;
            width: 100%;
            height: auto;
            background: #fff;
        }
        .info {
            padding: 24px 28px 28px;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            line-height: 1.3;
        }
        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 22px;
        }
        a.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
        }
        .primary {
            background: var(--accent);
            color: #fff;
        }
        .ghost {
            border: 1px solid var(--line);
            color: var(--text);
        }
    </style>
</head>
<body>
    <main class="wrap">
        <article class="card">
            <video
                controls
                playsinline
                preload="metadata"
                poster="https://q5.qa/linkedin-cover.jpg"
                src="https://q5.qa/video.mp4">
            </video>
            <div class="info">
                <h1>Mohammed Al-Abyah</h1>
                <p>Introduction video. Press play to watch.</p>
                <div class="actions">
                    <a class="btn primary" href="https://q5.qa/video.mp4">Download video</a>
                    <a class="btn ghost" href="https://q5.qa/">Back to website</a>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
