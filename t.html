<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Channels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/7.2.3/video-js.css" rel="stylesheet" />
    <style>
        .channel-active { background-color: rgb(191, 219, 254); }
        .floating-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }
        /* Video player container adjusted to top */
        #video-container {
            width: 100%;
            max-width: 800px; /* Adjust maximum size for larger screens */
            margin: 20px auto;
            aspect-ratio: 16 / 9;
        }
        /* Media queries for smaller screens */
        @media (max-width: 768px) {
            .floating-button {
                width: 40px;
                height: 40px;
                bottom: 15px;
                right: 15px;
            }
            /* Adjusting video container for mobile devices */
            #video-container {
                width: 90%;
                max-width: 320px; /* Smaller size on mobile */
                height: 180px;
                margin-top: 10px; /* Reduced margin for mobile view */
            }
        }
    </style>
</head>
<body class="flex h-screen relative flex-col">

    <!-- Video Player -->
    <div id="video-container" class="flex-1 p-4 flex items-center justify-center hidden">
        <video
            id="hls-example"
            class="video-js vjs-default-skin"
            controls
            preload="auto"
            playsinline
        >
            <source id="stream-source" type="application/x-mpegURL" />
        </video>
    </div>

    <!-- Categories Sidebar -->
    <div id="categories" class="w-64 md:w-1/4 bg-gray-100 p-4 overflow-y-auto">
        <h2 class="text-xl font-bold mb-4">Categories</h2>
        <div onclick="selectCategory('sports')" class="category-item p-2 mb-2 cursor-pointer hover:bg-gray-200">
            Sports
        </div>
    </div>

    <!-- Channels Sidebar -->
    <div id="channels" class="w-64 md:w-1/4 bg-white p-4 border-r overflow-y-auto">
        <h3 id="category-title" class="text-lg font-semibold mb-4"></h3>
        <div id="channel-list"></div>
    </div>

    <!-- Floating Button -->
    <div id="back-button" class="floating-button" onclick="handleBack()">
        <img src="https://cdn-icons-png.flaticon.com/512/93/93634.png" alt="Menu" class="w-6 h-6">
    </div>

    <script src="https://vjs.zencdn.net/7.2.3/video.js"></script>
    <script src="https://vjs.zencdn.net/ie8/ie8-version/videojs-ie8.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-hls/5.14.1/videojs-contrib-hls.js"></script>
    <script>
        // Data for channels
        const channelData = {
            sports: [
                {
                    id: 'bein-hd',
                    name: 'BeIN Sports HD',
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Bein_sport_logo.png/2560px-Bein_sport_logo.png',
                    streamUrl: 'https://xyzdddd.mizhls.ru/lb/premium91/index.m3u8'
                }
            ]
        };

        let player = null;
        let currentView = 'categories'; // Tracks current view: 'categories', 'channels', or 'player'

        // Select Category (display channels)
        function selectCategory(categoryId) {
            const categoriesDiv = document.getElementById('categories');
            const channelsDiv = document.getElementById('channels');
            const channelList = document.getElementById('channel-list');
            const categoryTitle = document.getElementById('category-title');

            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('channel-active'));
            event.currentTarget.classList.add('channel-active');

            categoriesDiv.classList.add('hidden');
            channelsDiv.classList.remove('hidden');
            categoryTitle.textContent = categoryId.charAt(0).toUpperCase() + categoryId.slice(1);

            channelList.innerHTML = '';
            channelData[categoryId].forEach(channel => {
                const channelEl = document.createElement('div');
                channelEl.innerHTML = `
                    <div class="flex items-center p-2 mb-2 cursor-pointer hover:bg-gray-100"
                         onclick="playChannel('${channel.streamUrl}', '${channel.name}')">
                        <img src="${channel.logo}" alt="${channel.name}" 
                             class="w-10 h-10 mr-3 object-contain">
                        <span>${channel.name}</span>
                    </div>
                `;
                channelList.appendChild(channelEl);
            });

            currentView = 'channels';
        }

        // Play selected channel
        function playChannel(streamUrl, channelName) {
            const videoContainer = document.getElementById('video-container');
            const streamSource = document.getElementById('stream-source');

            videoContainer.classList.remove('hidden');
            streamSource.src = streamUrl;

            if (!player) {
                player = videojs("hls-example", {
                    responsive: true,
                    fluid: true,
                    nativeControlsForTouch: true
                });
            } else {
                player.src({ type: "application/x-mpegURL", src: streamUrl });
            }

            player.play();
            currentView = 'player';
        }

        // Handle Back Button Logic
        function handleBack() {
            const categoriesDiv = document.getElementById('categories');
            const videoContainer = document.getElementById('video-container');
            const channelsDiv = document.getElementById('channels');

            if (currentView === 'player') {
                categoriesDiv.classList.remove('hidden'); // Show categories again
                videoContainer.classList.add('hidden'); // Hide video player
                currentView = 'categories';
            } else if (currentView === 'channels') {
                categoriesDiv.classList.remove('hidden'); // Show categories again
                channelsDiv.classList.add('hidden'); // Hide channels list
                currentView = 'categories';
            }
        }
    </script>
</body>
</html>
