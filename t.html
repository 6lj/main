<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قنوات التلفزيون</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/7.2.3/video-js.css" rel="stylesheet" />
    <style>
        .channel-active { background-color: rgb(191, 219, 254); }
        .floating-button {
            position: fixed;
            bottom: 20px;
            left: 20px; /* تغيير الجهة إلى اليسار للغة العربية */
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }
        /* ضبط حاوية الفيديو لتكون في الأعلى */
        #video-container {
            width: 100%;
            max-width: 800px; /* تعديل الحجم الأقصى للشاشات الأكبر */
            margin: 20px auto;
            aspect-ratio: 16 / 9;
        }
        /* استعلامات الوسائط للأجهزة ذات الشاشات الصغيرة */
        @media (max-width: 768px) {
            .floating-button {
                width: 40px;
                height: 40px;
                bottom: 15px;
                left: 15px;
            }
            /* ضبط حاوية الفيديو للأجهزة المحمولة */
            #video-container {
                width: 90%;
                max-width: 320px;
                height: 180px;
                margin-top: 10px;
            }
            /* ترتيب الفئات والقنوات فوق بعضها البعض */
            #categories, #channels {
                width: 100%;
                max-width: none;
            }
        }

        /* تخصيص زر "لم يعمل معي؟" */
        #support-button {
            background-color: white;
            color: black;
            border: 1px solid black;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        #support-options {
            display: none;
            gap: 10px;
        }

        .support-option {
            background-color: white;
            color: black;
            padding: 8px 16px;
            border: 1px solid black;
            border-radius: 5px;
            cursor: pointer;
        }

        /* تخصيص الخطوات لتكون أصغر */
        #iphone-steps ol {
            font-size: 14px;
        }

        #iphone-steps img {
            max-width: 120px;
            margin-top: 10px;
        }

        /* وضع الخطوات في المنتصف */
        #iphone-steps {
            text-align: center;
            margin-top: 20px;
        }

        /* زر "فهمت" لإخفاء الخطوات */
        #understood-button {
            background-color: white;
            color: black;
            border: 1px solid black;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* تخصيص نص العمل من قبل */
        #footer {
            background-color: #f3f4f6;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }

        /* تخصيص نموذج إدخال الكود */
        #code-section {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        #code-result {
            display: none;
            margin-top: 10px;
            font-weight: bold;
        }

        /* قيم الإعلان */
        #advertisement {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        /* تخصيص لون الحافة عندما يكون الكود صحيحًا */
        .border-green-500 {
            border-color: #34D399; /* لون أخضر */
        }
    </style>
</head>
<body class="flex h-screen relative flex-col">

    <!-- نص صاحب العمل -->

    <!-- مشغل الفيديو -->
    <div id="video-container" class="flex-1 p-4 flex items-center justify-center hidden">

            id="hls-example"
            class="video-js vjs-default-skin"
            controls
            preload="auto"
            playsinline

    <!-- الشريط الجانبي للفئات -->
    <div id="categories" class="w-64 md:w-1/4 bg-gray-100 p-4 overflow-y-auto">

        <div onclick="selectCategory('sports')" class="category-item p-2 mb-2 cursor-pointer hover:bg-gray-200">
            رياضة
        </div>
    </div>

    <!-- الشريط الجانبي للقنوات -->

        <h3 id="category-title" class="text-lg font-semibold mb-4"></h3>
        <div id="channel-list"></div>
    </div>

    <!-- الزر العائم -->
    <div id="back-button" class="floating-button" onclick="handleBack()">

    </div>

    <!-- خيار "لم يعمل معي؟" -->
    <div id="support-section" class="w-full p-4 text-center mt-auto">
        <button id="support-button" onclick="toggleSupportOptions()">لم يعمل معي؟</button>

        <!-- الخيارات الثلاثة عند الضغط على "لم يعمل معي؟" -->
        <div id="support-options" class="flex justify-center gap-4 mt-4">
            <button class="support-option" onclick="handleSupport('iphone')">آيفون / آيباد</button>
            <button class="support-option" onclick="handleSupport('android')">أندرويد / جالكسي</button>
            <button class="support-option" onclick="handleSupport('tv')">تلفزيون</button>
        </div>
    </div>

    <!-- الخطوات الخاصة بـ آيفون -->

            <img src="https://i.ibb.co/4ZYPJy1/975-CE5-E9-75-E3-42-BB-823-F-7333-F3-AC7380.jpg" alt="Alook Search" class="w-1/3 mt-2 mb-4">
            
            <li>قم بتحميل تطبيق <strong>Alook</strong></li>
            <img src="https://i.ibb.co/k3yLq1c/7-A6-B75-A6-9-B77-4304-9-F22-04-A2-F0-AD3-AE0.jpg" alt="Download Alook" class="w-1/3 mt-2 mb-4">
            
            <li>افتح التطبيق واذهب إلى <strong>Alook</strong></li>
            <img src="https://i.ibb.co/HXWpn2r/4574-C54-C-999-F-430-E-94-B5-0808-E2-C3-DA02.jpg" alt="Alook App" class="w-1/3 mt-2 mb-4">
            
            <li>في الأسفل، اكتب <strong>q5.qa/t</strong></li>
            <img src="https://i.ibb.co/rcD015k/F88-EF642-485-E-45-A8-8-BB6-B47-B47-A9-B6-F2.jpg" alt="Enter q5.qa/t" class="w-1/3 mt-2 mb-4">
            
            <li>استمتع!</li>
        </ol>

        <!-- زر "فهمت" لإخفاء الخطوات -->
        <button id="understood-button" onclick="hideSteps()">فهمت</button>
    </div>

    <!-- نموذج إدخال الكود -->
    <div id="code-section">
        <input type="text" id="code-input" placeholder="أدخل الكود" class="border p-2" />
        <button onclick="verifyCode()" class="bg-white text-black border border-black p-2 rounded">تحقق</button>
        <div id="code-result">خذ الكود من الرقم 0570876887 (قيمة الكود: 20 ريال في السنة).</div>
    </div>

    <div id="advertisement">بواسطة ENDUP</div>

                {

                }
            ]
        };

        let player = null;
        let currentView = 'categories'; // لتتبع العرض الحالي: 'الفئات'، 'القنوات'، أو 'مشغل الفيديو'
        const correctCode = "aon"; // الكود الصحيح

        // تحديد الفئة (عرض القنوات)
        function selectCategory(categoryId) {
            if (!isCodeVerified()) {
                alert('يرجى التحقق من الكود أولاً.'); // رسالة التحذير
                return;
            }

            const categoriesDiv = document.getElementById('categories');
            const channelsDiv = document.getElementById('channels');
            const channelList = document.getElementById('channel-list');
            const categoryTitle = document.getElementById('category-title');

            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('channel-active'));
            event.currentTarget.classList.add('channel-active');

            categoriesDiv.classList.add('hidden');
            channelsDiv.classList.remove('hidden');
            categoryTitle.textContent = categoryId.charAt(0).toUpperCase() + categoryId.slice(1);

            channelList.innerHTML = '';
            channelData[categoryId].forEach(channel => {
                const channelEl = document.createElement('div');
                channelEl.innerHTML = `
                    <div class="flex items-center p-2 mb-2 cursor-pointer hover:bg-gray-100"
                         onclick="playChannel('${channel.streamUrl}', '${channel.name}')">
                        <img src="${channel.logo}" alt="${channel.name}" 
                             class="w-10 h-10 mr-3 object-contain">
                        <span>${channel.name}</span>
                    </div>
                `;
                channelList.appendChild(channelEl);
            });

            currentView = 'channels';
        }

        // التحقق من الكود
        function isCodeVerified() {
            return document.getElementById('code-input').value.trim() === correctCode; // تحقق إذا كان الكود المدخل هو "aon"
        }

        // تشغيل القناة المحددة
        function playChannel(streamUrl, channelName) {
            if (!isCodeVerified()) {
                alert('يرجى التحقق من الكود أولاً.'); // رسالة التحذير
                return;
            }

            const videoContainer = document.getElementById('video-container');
            const streamSource = document.getElementById('stream-source');

            videoContainer.classList.remove('hidden');
            streamSource.src = streamUrl;

            if (!player) {
                player = videojs("hls-example", {
                    responsive: true,
                    fluid: true,
                    nativeControlsForTouch: true
                });
            } else {
                player.src({ type: "application/x-mpegURL", src: streamUrl });
            }

            player.play();

            // إخفاء القنوات بعد التشغيل
            document.getElementById('channels').classList.add('hidden');

            currentView = 'player';
        }

        // التعامل مع الضغط على "لم يعمل معي؟"
        function toggleSupportOptions() {
            const supportOptions = document.getElementById('support-options');
            supportOptions.style.display = supportOptions.style.display === 'flex' ? 'none' : 'flex';
        }

        // التعامل مع الضغط على أحد الخيارات
        function handleSupport(platform) {
            const iphoneSteps = document.getElementById('iphone-steps');
            
            if (platform === 'iphone') {
                iphoneSteps.classList.remove('hidden');
            }
        }

        // إخفاء الخطوات
        function hideSteps() {
            const iphoneSteps = document.getElementById('iphone-steps');
            iphoneSteps.classList.add('hidden');
        }

        // تعديل دالة العودة
        function handleBack() {
            if (currentView === 'channels') {
                // العودة إلى الفئات
                document.getElementById('categories').classList.remove('hidden');
                document.getElementById('channels').classList.add('hidden');
                currentView = 'categories';
            } else if (currentView === 'player') {
                // العودة إلى القنوات
                document.getElementById('channels').classList.remove('hidden');
                document.getElementById('video-container').classList.add('hidden');
                currentView = 'channels';
            }
        }

        // دالة تحقق الكود
        function verifyCode() {
            const codeInput = document.getElementById('code-input');
            const codeValue = codeInput.value.trim();
            if (codeValue === correctCode) {
                codeInput.classList.add('border-green-500'); // إضافة فصل CSS لتلوين الحافة
                document.getElementById('code-result').style.display = 'none'; // إخفاء نتيجة الكود
                // لا حاجة لإظهار رسالة.
            } else {
                codeInput.classList.remove('border-green-500'); // إزالة اللون الأخضر إذا كان الكود غير صحيح
                alert('كود غير صحيح، يرجى المحاولة مرة أخرى. خذ الكود من الرقم 0570876887 (قيمة الكود: 20 ريال في السنة).');
                document.getElementById('code-result').style.display = 'block'; // إظهار الرسالة
                document.getElementById('video-container').classList.add('hidden');
                document.getElementById('channels').classList.add('hidden');
                document.getElementById('categories').classList.remove('hidden');
            }
        }
